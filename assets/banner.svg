<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Explain Agent: select any text, get an expert explanation">
<style>
  .t{font-family:Georgia,'Times New Roman',serif}
  .s{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,Menlo,Consolas,monospace}
  @keyframes sweep{0%,18%{transform:scaleX(0)}34%,84%{transform:scaleX(1)}92%,100%{transform:scaleX(1);opacity:0}}
  @keyframes pop{0%,34%{opacity:0;transform:scale(.6) translateY(10px)}42%{opacity:1;transform:scale(1.04) translateY(0)}46%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.96)}}
  @keyframes l1{0%,46%{transform:scaleX(0)}56%,100%{transform:scaleX(1)}}
  @keyframes l2{0%,56%{transform:scaleX(0)}66%,100%{transform:scaleX(1)}}
  @keyframes l3{0%,66%{transform:scaleX(0)}74%,100%{transform:scaleX(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes cur{0%,12%{transform:translate(0,0);opacity:0}18%{opacity:1}34%{transform:translate(206px,0)}44%,100%{transform:translate(236px,34px);opacity:1}90%,100%{opacity:0}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-14px)}}
  .cycle{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
  #hl{transform-origin:0 50%;transform-box:fill-box;animation-name:sweep}
  #card{transform-origin:0 0;transform-box:fill-box;animation-name:pop}
  #a1{transform-origin:0 50%;transform-box:fill-box;animation-name:l1}
  #a2{transform-origin:0 50%;transform-box:fill-box;animation-name:l2}
  #a3{transform-origin:0 50%;transform-box:fill-box;animation-name:l3}
  #cursor{animation-name:cur;animation-timing-function:ease-in-out}
  #orb{animation:bob 3s ease-in-out infinite}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  .b1{animation:drift 14s ease-in-out infinite}.b2{animation:drift 18s ease-in-out infinite reverse}.b3{animation:drift 16s ease-in-out infinite}
</style>
<rect width="1200" height="420" fill="#F4EFE6"/>
<g opacity=".7">
  <circle class="b1" cx="150" cy="70" r="150" fill="#E3DAFF"/>
  <circle class="b2" cx="1080" cy="40" r="170" fill="#FFE1CB"/>
  <circle class="b3" cx="700" cy="440" r="170" fill="#D6F3E4"/>
</g>
<!-- left: title -->
<text class="t" x="70" y="190" font-size="92" font-weight="700" fill="#1B1B2F" letter-spacing="-2">Explain</text>
<text class="t" x="70" y="282" font-size="92" font-style="italic" fill="#7C66E8" letter-spacing="-2">Agent</text>
<text class="s" x="74" y="336" font-size="23" fill="#55546B">Select any text. Get an expert explanation.</text>
<text class="m" x="74" y="372" font-size="16" fill="#8B8AA0">chrome extension  /  manifest v3  /  vanilla js</text>
<!-- right: article window -->
<g transform="translate(640,52)">
  <rect width="490" height="316" rx="22" fill="#FFFEFB"/>
  <rect width="490" height="316" rx="22" fill="none" stroke="#EEE8DC"/>
  <circle cx="28" cy="28" r="6" fill="#F6B3B3"/><circle cx="48" cy="28" r="6" fill="#FCD96B"/><circle cx="68" cy="28" r="6" fill="#9BE5B9"/>
  <rect x="34" y="62" width="250" height="14" rx="7" fill="#1B1B2F"/>
  <rect x="34" y="96" width="400" height="9" rx="4.5" fill="#DAD5CB"/>
  <rect x="34" y="116" width="360" height="9" rx="4.5" fill="#DAD5CB"/>
  <!-- line with selectable word -->
  <rect x="34" y="144" width="130" height="9" rx="4.5" fill="#DAD5CB"/>
  <rect id="hl" class="cycle" x="172" y="138" width="104" height="21" rx="5" fill="#CFC3FC"/>
  <rect x="180" y="144" width="88" height="9" rx="4.5" fill="#8B84B8"/>
  <rect x="284" y="144" width="150" height="9" rx="4.5" fill="#DAD5CB"/>
  <rect x="34" y="166" width="390" height="9" rx="4.5" fill="#DAD5CB"/>
  <rect x="34" y="186" width="300" height="9" rx="4.5" fill="#DAD5CB"/>
  <!-- card -->
  <g id="card" class="cycle">
    <rect x="150" y="178" width="270" height="128" rx="18" fill="#FFFFFF" stroke="#E4E0F5" />
    <rect x="150" y="178" width="270" height="128" rx="18" fill="none" stroke="#B7A6FA" stroke-opacity=".25" stroke-width="6"/>
    <rect id="a1" class="cycle" x="170" y="202" width="130" height="10" rx="5" fill="#1B1B2F"/>
    <rect id="a2" class="cycle" x="170" y="226" width="226" height="8" rx="4" fill="#CFCADF"/>
    <rect id="a3" class="cycle" x="170" y="244" width="190" height="8" rx="4" fill="#CFCADF"/>
    <rect x="170" y="268" width="226" height="24" rx="12" fill="#F4F2FB"/>
    <circle cx="384" cy="280" r="9" fill="#111"/>
    <!-- orb -->
    <g transform="translate(346,134)"><g id="orb">
      <g transform="scale(1.05)">
        <circle cx="27" cy="29" r="21" fill="#B7A6FA"/>
        <path d="M12 25 A16 16 0 0 1 25 13" stroke="#fff" stroke-opacity=".6" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M22 10 q2.5 -6 6 -1 q2.5 -4 5 1" stroke="#1B1B2F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <ellipse class="eye" cx="20" cy="27" rx="2.2" ry="2.9" fill="#1B1B2F"/>
        <ellipse class="eye" cx="34" cy="27" rx="2.2" ry="2.9" fill="#1B1B2F"/>
        <path d="M21 35 q6 6 12 0" stroke="#1B1B2F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="14" cy="34" rx="3.4" ry="2.2" fill="#FB7185" opacity=".3"/><ellipse cx="40" cy="34" rx="3.4" ry="2.2" fill="#FB7185" opacity=".3"/>
      </g>
    </g></g>
  </g>
  <!-- cursor -->
  <g transform="translate(170,150)"><g id="cursor" class="cycle">
    <path d="M2 1 L2 22 L8 17 L12 27 L16 25 L12 15.500 L20 15 Z" fill="#1B1B2F" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </g></g>
</g>
</svg>
